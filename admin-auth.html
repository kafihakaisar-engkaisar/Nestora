<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nestora | Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-auth-card {
            max-width: 440px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            border-top: 5px solid #dc2626;
        }
        .admin-portal-badge {
            display: inline-block;
            background: #fee2e2;
            color: #dc2626;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .admin-login-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .admin-login-sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .admin-input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .admin-input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .admin-input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .admin-input-group input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
        }
        .admin-submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }
        .admin-submit-btn:hover {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
        }
        .auth-footer-links {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
        .auth-footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .default-creds-hint {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            color: #475569;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            Nestora
        </div>
        <div class="nav-right" style="display: flex; gap: 10px;">
            <a href="index.html" class="nav-box owner-box">
                Home
            </a>
            <a href="owner-auth.html" class="nav-box owner-box">
                Owner Portal
            </a>
        </div>
    </nav>

    <!-- ADMIN AUTH CONTAINER -->
    <div style="min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="admin-auth-card text-center">
            <span class="admin-portal-badge">🛡️ System Administration</span>
            <h1 class="admin-login-title">Admin Sign In</h1>
            <p class="admin-login-sub">Platform-wide governance, analytics and records</p>

            <form id="adminLoginForm">
                <div class="admin-input-group">
                    <label for="adminLoginId">Admin ID or Email</label>
                    <input type="text" id="adminLoginId" required placeholder="e.g. ADM1001 or admin@nestora.com">
                </div>

                <div class="admin-input-group">
                    <label for="adminLoginPassword">Master Password</label>
                    <input type="password" id="adminLoginPassword" required placeholder="Enter admin password">
                </div>

                <div id="adminMessage" style="font-size: 13px; margin-bottom: 12px;"></div>

                <button type="submit" class="admin-submit-btn">
                    Authenticate & Enter Admin Panel 🔐
                </button>

                <div class="auth-footer-links">
                    <a href="index.html">← Return to Public Portal</a>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
