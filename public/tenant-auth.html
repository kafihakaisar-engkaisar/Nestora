<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Nestora | Tenant</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Nestora
    </div>

    <div class="nav-right">

        <a href="index.html" class="nav-box">
            Home
        </a>

        <a href="owner-auth.html" class="nav-box owner-box">
            Owner
        </a>

    </div>

</nav>


<!-- TENANT AUTH -->

<main class="auth-page">

    <div class="auth-card">

        <h1>Tenant Access</h1>

        <p class="auth-subtitle">
            Sign in or create your Nestora tenant account
        </p>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="auth-tab active"
                onclick="showLogin()">
                Sign In
            </button>

            <button
                id="signupTab"
                class="auth-tab"
                onclick="showSignup()">
                Sign Up
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">

                <label>Tenant ID</label>

                <input
                    type="text"
                    id="loginUserId"
                    placeholder="Enter Tenant ID"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter Password"
                    required>

            </div>


            <button type="submit" class="auth-button">
                Sign In
            </button>

        </form>


        <!-- SIGNUP -->

        <form id="signupForm" style="display: none;">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="Enter phone number"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter email"
                    required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="signupAge"
                        placeholder="Age"
                        required>

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select id="signupGender" required>

                        <option value="">
                            Select
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>Address</label>

                <textarea
                    id="signupAddress"
                    placeholder="Enter your address"
                    required></textarea>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    required>

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="signupConfirmPassword"
                    placeholder="Confirm password"
                    required>

            </div>


            <button type="submit" class="auth-button">
                Create Tenant Account
            </button>

        </form>


        <p id="message" class="message"></p>

    </div>

</main>


<script src="app.js"></script>
<script src="robot.js"></script>

</body>

</html>
